name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          if [ ! -d android ]; then
            npx cap add android
          fi

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          content = gradle_file.read_text()
          dependency = 'implementation "com.unity3d.ads:unity-ads:4.21.0"'

          if dependency not in content:
              if "dependencies {" not in content:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              content = content.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )
              gradle_file.write_text(content)
              print("Unity Ads SDK dependency added.")
          else:
              print("Unity Ads SDK dependency already present.")
          PY

          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Integrate Unity Ads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")

          path = files[0]
          match = re.search(r"^package\s+([\w.]+)\s*;", path.read_text(), re.M)
          if not match:
              raise SystemExit("Cannot find Java package declaration")
          package = match.group(1)

          java = r'''package __PACKAGE__;

          import android.os.Bundle;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import androidx.annotation.OptIn;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.BannerAd;
          import com.unity3d.ads.BannerConfiguration;
          import com.unity3d.ads.BannerShowListener;
          import com.unity3d.ads.BannerSize;
          import com.unity3d.ads.InitializationConfiguration;
          import com.unity3d.ads.InterstitialAd;
          import com.unity3d.ads.InterstitialShowListener;
          import com.unity3d.ads.LoadConfiguration;
          import com.unity3d.ads.RewardedAd;
          import com.unity3d.ads.RewardedShowListener;
          import com.unity3d.ads.ShowConfiguration;
          import com.unity3d.ads.ShowFinishState;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsError;
          import com.unity3d.ads.UnityAdsExperimental;

          @OptIn(markerClass = UnityAdsExperimental.class)
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  UnityAdsBridge adsBridge = new UnityAdsBridge(webView);
                  webView.addJavascriptInterface(adsBridge, "UnityAdsBridge");
                  webView.post(() -> webView.reload());
                  adsBridge.initialize();
              }

              public final class UnityAdsBridge {
                  private static final String GAME_ID = "800409689";
                  private static final String BANNER_ID = "BP_Banner_Android";
                  private static final String INTERSTITIAL_ID = "BP_Interstitial_Android";
                  private static final String REWARDED_ID = "BP_Rewarded_Android";

                  private final WebView webView;
                  private BannerAd bannerAd;
                  private FrameLayout bannerSlot;
                  private InterstitialAd interstitialAd;
                  private RewardedAd rewardedAd;
                  private boolean interstitialLoading = false;
                  private boolean rewardedLoading = false;

                  UnityAdsBridge(WebView webView) {
                      this.webView = webView;
                  }

                  private boolean isLocalPage() {
                      String url = webView.getUrl();
                      return url != null &&
                          (url.startsWith("https://localhost") ||
                           url.startsWith("http://localhost") ||
                           url.startsWith("capacitor://localhost"));
                  }

                  private int dp(int value) {
                      return Math.round(value *
                          getResources().getDisplayMetrics().density);
                  }

                  private void fireEvent(String name) {
                      webView.post(() -> webView.evaluateJavascript(
                          "window.dispatchEvent(new Event('" + name + "'))", null));
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  void initialize() {
                      InitializationConfiguration config =
                          new InitializationConfiguration.Builder(GAME_ID)
                              .withTestMode(false)
                              .build();

                      UnityAds.initialize(config, error -> {
                          if (error != null) {
                              Log.e("UnityAds", "Initialization failed: " + error.getMessage());
                              return;
                          }
                          Log.d("UnityAds", "Initialization successful");
                          loadBanner();
                          loadInterstitial();
                          loadRewarded();
                      });
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadBanner() {
                      BannerShowListener showListener = new BannerShowListener() {
                          @Override
                          public void onImpression(BannerAd ad) {}

                          @Override
                          public void onClicked(BannerAd ad) {}

                          @Override
                          public void onFailedToShow(BannerAd ad, UnityAdsError error) {
                              Log.e("UnityAds", "Banner failed to show: " + error.getMessage());
                          }
                      };

                      BannerConfiguration config = new BannerConfiguration.Builder(
                          BANNER_ID, new BannerSize(320, 50), showListener
                      ).build();

                      BannerAd.load(config, (loaded, error) -> {
                          if (loaded == null || error != null) {
                              Log.e("UnityAds", "Banner load failed: " +
                                  (error == null ? "Unknown error" : error.getMessage()));
                              return;
                          }

                          runOnUiThread(() -> {
                              bannerAd = loaded;
                              View adView = loaded.getView();
                              if (adView == null) return;

                              FrameLayout root = findViewById(android.R.id.content);
                              if (bannerSlot != null &&
                                  bannerSlot.getParent() instanceof ViewGroup) {
                                  ((ViewGroup) bannerSlot.getParent()).removeView(bannerSlot);
                              }

                              bannerSlot = new FrameLayout(MainActivity.this);
                              root.addView(bannerSlot,
                                  new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      dp(50), Gravity.BOTTOM));

                              if (adView.getParent() instanceof ViewGroup) {
                                  ((ViewGroup) adView.getParent()).removeView(adView);
                              }

                              bannerSlot.addView(adView,
                                  new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      Gravity.CENTER));
                          });
                      });
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadInterstitial() {
                      if (interstitialLoading || interstitialAd != null) return;
                      interstitialLoading = true;

                      InterstitialAd.load(
                          new LoadConfiguration.Builder(INTERSTITIAL_ID).build(),
                          (loaded, error) -> runOnUiThread(() -> {
                              interstitialLoading = false;
                              if (loaded == null || error != null) {
                                  Log.e("UnityAds", "Interstitial load failed: " +
                                      (error == null ? "Unknown error" : error.getMessage()));
                                  return;
                              }
                              interstitialAd = loaded;
                              loaded.setOnAdExpired(expired -> runOnUiThread(() -> {
                                  interstitialAd = null;
                                  loadInterstitial();
                              }));
                          })
                      );
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadRewarded() {
                      if (rewardedLoading || rewardedAd != null) return;
                      rewardedLoading = true;

                      RewardedAd.load(
                          new LoadConfiguration.Builder(REWARDED_ID).build(),
                          (loaded, error) -> runOnUiThread(() -> {
                              rewardedLoading = false;
                              if (loaded == null || error != null) {
                                  Log.e("UnityAds", "Rewarded load failed: " +
                                      (error == null ? "Unknown error" : error.getMessage()));
                                  return;
                              }
                              rewardedAd = loaded;
                              loaded.setOnAdExpired(expired -> runOnUiThread(() -> {
                                  rewardedAd = null;
                                  loadRewarded();
                              }));
                          })
                      );
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (!isLocalPage()) return;
                          if (interstitialAd == null) {
                              fireEvent("unityAdNotReady");
                              loadInterstitial();
                              return;
                          }

                          InterstitialAd ad = interstitialAd;
                          interstitialAd = null;
                          ad.show(MainActivity.this,
                              new ShowConfiguration.Builder().build(),
                              new InterstitialShowListener() {
                                  @Override public void onStarted(InterstitialAd ad) {}
                                  @Override public void onClicked(InterstitialAd ad) {}
                                  @Override public void onCompleted(InterstitialAd ad, ShowFinishState state) {
                                      loadInterstitial();
                                  }
                                  @Override public void onFailed(InterstitialAd ad, UnityAdsError error) {
                                      Log.e("UnityAds", "Interstitial show failed: " + error.getMessage());
                                      loadInterstitial();
                                  }
                              });
                      });
                  }

                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (!isLocalPage()) return;
                          if (rewardedAd == null) {
                              fireEvent("unityAdNotReady");
                              loadRewarded();
                              return;
                          }

                          RewardedAd ad = rewardedAd;
                          rewardedAd = null;
                          ad.show(MainActivity.this,
                              new ShowConfiguration.Builder().build(),
                              new RewardedShowListener() {
                                  @Override public void onStarted(RewardedAd ad) {}
                                  @Override public void onClicked(RewardedAd ad) {}
                                  @Override public void onCompleted(RewardedAd ad, ShowFinishState state) {
                                      loadRewarded();
                                  }
                                  @Override public void onFailed(RewardedAd ad, UnityAdsError error) {
                                      Log.e("UnityAds", "Rewarded show failed: " + error.getMessage());
                                      loadRewarded();
                                  }
                                  @Override public void onRewarded(RewardedAd ad) {
                                      fireEvent("unityRewardEarned");
                                  }
                              });
                      });
                  }
              }
          }
          '''

          path.write_text(java.replace("__PACKAGE__", package))

          html_path = Path("www/index.html")
          html = html_path.read_text()
          marker = "<!-- UNITY_ADS_CONTROL_PANEL -->"
          addon = r'''
          <!-- UNITY_ADS_CONTROL_PANEL -->
          <style>
            body { padding-bottom: 72px !important; }
            #unity-ads-controls {
              position: fixed; right: 8px; bottom: 58px;
              z-index: 2147483647; display: flex; gap: 6px;
            }
            #unity-ads-controls button {
              padding: 7px 10px; border: 1px solid #ccc;
              border-radius: 18px; background: white; color: #222;
              font-size: 12px;
            }
          </style>
          <div id="unity-ads-controls">
            <button type="button" id="unity-reward-btn">Reward Ad</button>
            <button type="button" id="unity-interstitial-btn">Full-screen Ad</button>
          </div>
          <script>
          (function () {
            document.getElementById("unity-reward-btn").onclick = function () {
              if (window.UnityAdsBridge) window.UnityAdsBridge.showRewarded();
            };
            document.getElementById("unity-interstitial-btn").onclick = function () {
              if (window.UnityAdsBridge) window.UnityAdsBridge.showInterstitial();
            };
            window.addEventListener("unityAdNotReady", function () {
              alert("Ad is loading. Please try again in a few seconds.");
            });
            window.addEventListener("unityRewardEarned", function () {
              alert("Rewarded ad completed.");
            });
          })();
          </script>
          '''

          if marker not in html:
              if re.search(r"</body\s*>", html, re.I):
                  html = re.sub(r"</body\s*>", addon + "\n</body>", html,
                                count=1, flags=re.I)
              else:
                  html += addon
              html_path.write_text(html)

          print("Unity Ads integration generated.")
          PY

          npx cap copy android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
