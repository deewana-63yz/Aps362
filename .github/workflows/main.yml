name: Build Interexive - Easy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Prepare HTML app
        shell: bash
        run: |
          set -euo pipefail

          if [ -f index.html ]; then
            HTML_FILE=index.html
          else
            mapfile -t FILES < <(find . -maxdepth 1 -type f -iname '*.html')
            if [ "${#FILES[@]}" -ne 1 ]; then
              echo "ERROR: Add one HTML file to the repository root, or name it index.html."
              exit 1
            fi
            HTML_FILE="${FILES[0]}"
          fi

          mkdir -p www
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='www/' --exclude='android/' --exclude='node_modules/' --exclude='package.json' --exclude='package-lock.json' --exclude='capacitor.config.json' ./ www/
          cp "$HTML_FILE" www/index.html

          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm install --save-dev @capacitor/assets

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.interexive.easy",
            "appName": "Interexive - Easy",
            "webDir": "www"
          }
          EOF

          mkdir -p assets
          test -f logo.png || { echo "ERROR: logo.png missing from repository root"; exit 1; }
          cp logo.png assets/icon.png

          if [ ! -d android ]; then
            npx cap add android
          fi

          python3 - <<'PY'
          from pathlib import Path

          gradle_file = Path("android/app/build.gradle")
          content = gradle_file.read_text()
          dependency = 'implementation "com.unity3d.ads:unity-ads:4.21.0"'

          if dependency not in content:
              if "dependencies {" not in content:
                  raise SystemExit("Could not find dependencies block in app/build.gradle")
              content = content.replace(
                  "dependencies {",
                  "dependencies {\n    " + dependency,
                  1
              )
              gradle_file.write_text(content)
              print("Unity Ads SDK dependency added.")
          else:
              print("Unity Ads SDK dependency already present.")
          PY

          npx cap sync android
          npx @capacitor/assets generate --android

      - name: Integrate Unity Ads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android/app/src/main/java").rglob("MainActivity.java"))
          if len(files) != 1:
              raise SystemExit(f"Expected one MainActivity.java, found {len(files)}")

          path = files[0]
          match = re.search(r"^package\s+([\w.]+)\s*;", path.read_text(), re.M)
          if not match:
              raise SystemExit("Cannot find Java package declaration")
          package = match.group(1)

          java = r'''package __PACKAGE__;

          import android.os.Bundle;
          import android.util.Log;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.widget.FrameLayout;
          import androidx.annotation.OptIn;

          import com.getcapacitor.BridgeActivity;
          import com.unity3d.ads.BannerAd;
          import com.unity3d.ads.BannerConfiguration;
          import com.unity3d.ads.BannerShowListener;
          import com.unity3d.ads.BannerSize;
          import com.unity3d.ads.InitializationConfiguration;
          import com.unity3d.ads.InterstitialAd;
          import com.unity3d.ads.InterstitialShowListener;
          import com.unity3d.ads.LoadConfiguration;
          import com.unity3d.ads.RewardedAd;
          import com.unity3d.ads.RewardedShowListener;
          import com.unity3d.ads.ShowConfiguration;
          import com.unity3d.ads.ShowFinishState;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsError;
          import com.unity3d.ads.UnityAdsExperimental;

          @OptIn(markerClass = UnityAdsExperimental.class)
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = getBridge().getWebView();
                  UnityAdsBridge adsBridge = new UnityAdsBridge(webView);
                  webView.addJavascriptInterface(adsBridge, "UnityAdsBridge");
                  webView.post(() -> webView.reload());
                  adsBridge.initialize();
              }

              public final class UnityAdsBridge {
                  private static final String GAME_ID = "800409689";
                  private static final String BANNER_ID = "BP_Banner_Android";
                  private static final String INTERSTITIAL_ID = "BP_Interstitial_Android";
                  private static final String REWARDED_ID = "BP_Rewarded_Android";

                  private final WebView webView;
                  private BannerAd bannerAd;
                  private FrameLayout bannerSlot;
                  private InterstitialAd interstitialAd;
                  private RewardedAd rewardedAd;
                  private boolean interstitialLoading = false;
                  private boolean rewardedLoading = false;

                  UnityAdsBridge(WebView webView) {
                      this.webView = webView;
                  }

                  private boolean isLocalPage() {
                      String url = webView.getUrl();
                      return url != null &&
                          (url.startsWith("https://localhost") ||
                           url.startsWith("http://localhost") ||
                           url.startsWith("capacitor://localhost"));
                  }

                  private int dp(int value) {
                      return Math.round(value *
                          getResources().getDisplayMetrics().density);
                  }

                  private void fireEvent(String name) {
                      webView.post(() -> webView.evaluateJavascript(
                          "window.dispatchEvent(new Event('" + name + "'))", null));
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  void initialize() {
                      InitializationConfiguration config =
                          new InitializationConfiguration.Builder(GAME_ID)
                              .withTestMode(false)
                              .build();

                      UnityAds.initialize(config, error -> {
                          if (error != null) {
                              Log.e("UnityAds", "Initialization failed: " + error.getMessage());
                              return;
                          }
                          Log.d("UnityAds", "Initialization successful");
                          loadBanner();
                          loadInterstitial();
                          loadRewarded();
                      });
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadBanner() {
                      BannerShowListener showListener = new BannerShowListener() {
                          @Override
                          public void onImpression(BannerAd ad) {}

                          @Override
                          public void onClicked(BannerAd ad) {}

                          @Override
                          public void onFailedToShow(BannerAd ad, UnityAdsError error) {
                              Log.e("UnityAds", "Banner failed to show: " + error.getMessage());
                          }
                      };

                      BannerConfiguration config = new BannerConfiguration.Builder(
                          BANNER_ID, new BannerSize(320, 50), showListener
                      ).build();

                      BannerAd.load(config, (loaded, error) -> {
                          if (loaded == null || error != null) {
                              Log.e("UnityAds", "Banner load failed: " +
                                  (error == null ? "Unknown error" : error.getMessage()));
                              return;
                          }

                          runOnUiThread(() -> {
                              bannerAd = loaded;
                              View adView = loaded.getView();
                              if (adView == null) return;

                              FrameLayout root = findViewById(android.R.id.content);
                              if (bannerSlot != null &&
                                  bannerSlot.getParent() instanceof ViewGroup) {
                                  ((ViewGroup) bannerSlot.getParent()).removeView(bannerSlot);
                              }

                              bannerSlot = new FrameLayout(MainActivity.this);
                              root.addView(bannerSlot,
                                  new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      dp(50), Gravity.BOTTOM));

                              if (adView.getParent() instanceof ViewGroup) {
                                  ((ViewGroup) adView.getParent()).removeView(adView);
                              }

                              bannerSlot.addView(adView,
                                  new FrameLayout.LayoutParams(
                                      ViewGroup.LayoutParams.WRAP_CONTENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      Gravity.CENTER));
                          });
                      });
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadInterstitial() {
                      if (interstitialLoading || interstitialAd != null) return;
                      interstitialLoading = true;

                      InterstitialAd.load(
                          new LoadConfiguration.Builder(INTERSTITIAL_ID).build(),
                          (loaded, error) -> runOnUiThread(() -> {
                              interstitialLoading = false;
                              if (loaded == null || error != null) {
                                  Log.e("UnityAds", "Interstitial load failed: " +
                                      (error == null ? "Unknown error" : error.getMessage()));
                                  return;
                              }
                              interstitialAd = loaded;
                              loaded.setOnAdExpired(expired -> runOnUiThread(() -> {
                                  interstitialAd = null;
                                  loadInterstitial();
                              }));
                          })
                      );
                  }

                  @OptIn(markerClass = UnityAdsExperimental.class)
                  private void loadRewarded() {
                      if (rewardedLoading || rewardedAd != null) return;
                      rewardedLoading = true;

                      RewardedAd.load(
                          new LoadConfiguration.Builder(REWARDED_ID).build(),
                          (loaded, error) -> runOnUiThread(() -> {
                              rewardedLoading = false;
                              if (loaded == null || error != null) {
                                  Log.e("UnityAds", "Rewarded load failed: " +
                                      (error == null ? "Unknown error" : error.getMessage()));
                                  return;
                              }
                              rewardedAd = loaded;
                              loaded.setOnAdExpired(expired -> runOnUiThread(() -> {
                                  rewardedAd = null;
                                  loadRewarded();
                              }));
                          })
                      );
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (!isLocalPage()) return;
                          if (interstitialAd == null) {
                              fireEvent("unityAdNotReady");
                              loadInterstitial();
                              return;
                          }

                          InterstitialAd ad = interstitialAd;
                          interstitialAd = null;
                          ad.show(MainActivity.this,
                              new ShowConfiguration.Builder().build(),
                              new InterstitialShowListener() {
                                  @Override public void onStarted(InterstitialAd ad) {}
                                  @Override public void onClicked(InterstitialAd ad) {}
                                  @Override public void onCompleted(InterstitialAd ad, ShowFinishState state) {
                                      loadInterstitial();
                                  }
                                  @Override public void onFailed(InterstitialAd ad, UnityAdsError error) {
                                      Log.e("UnityAds", "Interstitial show failed: " + error.getMessage());
                                      loadInterstitial();
                                  }
                              });
                      });
                  }

                  @JavascriptInterface
                  public void showRewarded() {
                      runOnUiThread(() -> {
                          if (!isLocalPage()) return;
                          if (rewardedAd == null) {
                              fireEvent("unityAdNotReady");
                              loadRewarded();
                              return;
                          }

                          RewardedAd ad = rewardedAd;
                          rewardedAd = null;
                          ad.show(MainActivity.this,
                              new ShowConfiguration.Builder().build(),
                              new RewardedShowListener() {
                                  @Override public void onStarted(RewardedAd ad) {}
                                  @Override public void onClicked(RewardedAd ad) {}
                                  @Override public void onCompleted(RewardedAd ad, ShowFinishState state) {
                                      if (state == ShowFinishState.SKIPPED) {
                                          fireEvent("unityRewardFailed");
                                      }
                                      loadRewarded();
                                  }
                                  @Override public void onFailed(RewardedAd ad, UnityAdsError error) {
                                      Log.e("UnityAds", "Rewarded show failed: " + error.getMessage());
                                      fireEvent("unityRewardFailed");
                                      loadRewarded();
                                  }
                                  @Override public void onRewarded(RewardedAd ad) {
                                      fireEvent("unityRewardEarned");
                                  }
                              });
                      });
                  }
              }
          }
          '''

          path.write_text(java.replace("__PACKAGE__", package))

          html_path = Path("www/index.html")
          html = html_path.read_text()
          marker = "<!-- UNITY_ADS_CONTROL_PANEL -->"
          addon = r'''
          <!-- INTEREXIVE_ADS_START -->
          <style>
            body { padding-bottom: 72px !important; }
            #unity-ads-controls { position: fixed; right: 8px; bottom: 58px; z-index: 2147483000; display: flex; gap: 6px; }
            #unity-ads-controls button { padding: 8px 11px; border: 1px solid #ccc; border-radius: 18px; background: white; color: #222; font-size: 12px; }
            #ie-reward-popup { position: fixed; inset: 0; z-index: 2147483647; display: none; align-items: center; justify-content: center; box-sizing: border-box; padding: 18px; background: rgba(0,0,0,.72); font-family: Arial,sans-serif; }
            #ie-reward-card { width: 100%; max-width: 340px; box-sizing: border-box; padding: 24px 18px; border-radius: 16px; background: #082b66; color: #fff; text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
            #ie-reward-card h2 { margin: 0 0 12px; font-size: 21px; }
            #ie-reward-card p { margin: 10px 0; }
            #ie-reward-card button { display: block; width: 100%; box-sizing: border-box; margin-top: 10px; padding: 13px 10px; border: 0; border-radius: 8px; background: #fff; color: #082b66; font-size: 14px; font-weight: 700; }
            #ie-reward-card button:disabled { opacity: .45; }
            #ie-reward-card #ie-reward-continue { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.8); }
          </style>
          <div id="ie-reward-popup" role="dialog" aria-modal="true" aria-labelledby="ie-reward-title">
            <div id="ie-reward-card">
              <h2 id="ie-reward-title">Watch 2 Rewarded Ads for 10 Hours</h2>
              <p id="ie-reward-count">0 out of 2</p>
              <button type="button" id="ie-reward-ad1">Watch Rewarded Ad 1</button>
              <button type="button" id="ie-reward-ad2" disabled>Watch Rewarded Ad 2</button>
              <p id="ie-reward-message">Complete both ads to receive 10 hours of access.</p>
            </div>
          </div>
          <div id="unity-ads-controls">
            <button type="button" id="unity-reward-btn">Reward Ad</button>
            <button type="button" id="unity-interstitial-btn">Full-screen Ad</button>
          </div>
          <script>
          (function () {
            'use strict';
            var popup = document.getElementById('ie-reward-popup');
            var countText = document.getElementById('ie-reward-count');
            var message = document.getElementById('ie-reward-message');
            var firstButton = document.getElementById('ie-reward-ad1');
            var secondButton = document.getElementById('ie-reward-ad2');
            var count = parseInt(localStorage.getItem('ieRewardCount') || '0', 10);
            var unlockUntil = parseInt(localStorage.getItem('ieRewardUnlockUntil') || '0', 10);
            var busy = false;
            var popupAdPending = false;
            if (!Number.isFinite(count) || count < 0 || count > 1) count = 0;
            if (!Number.isFinite(unlockUntil)) unlockUntil = 0;
            if (unlockUntil > 0 && unlockUntil <= Date.now()) {
              localStorage.removeItem('ieRewardUnlockUntil');
              localStorage.removeItem('ieRewardCount');
              count = 0; unlockUntil = 0;
            }
            function draw() {
              countText.textContent = count + ' out of 2';
              firstButton.textContent = count >= 1 ? 'Rewarded Ad 1 completed' : 'Watch Rewarded Ad 1';
              secondButton.textContent = count >= 2 ? 'Rewarded Ad 2 completed' : 'Watch Rewarded Ad 2';
              firstButton.disabled = busy || count >= 1;
              secondButton.disabled = busy || count < 1 || count >= 2;
            }
            function startPopupAd() {
              if (busy || count >= 2) return;
              if (!window.UnityAdsBridge || typeof window.UnityAdsBridge.showRewarded !== 'function') {
                message.textContent = 'Unity Ads connection is unavailable. Please try again later.'; return;
              }
              busy = true; popupAdPending = true; message.textContent = 'Loading rewarded ad...'; draw();
              try { window.UnityAdsBridge.showRewarded(); }
              catch (error) { busy = false; popupAdPending = false; message.textContent = 'Could not start the ad. Please try again.'; draw(); }
            }
            firstButton.addEventListener('click', startPopupAd);
            secondButton.addEventListener('click', startPopupAd);
            window.addEventListener('unityAdNotReady', function () {
              if (popupAdPending) { popupAdPending = false; busy = false; message.textContent = 'Ad is loading. Please tap again in a few seconds.'; draw(); }
              else alert('Ad is loading. Please try again in a few seconds.');
            });
            window.addEventListener('unityRewardFailed', function () {
              if (!popupAdPending) return;
              popupAdPending = false; busy = false; message.textContent = 'Ad was not completed. Please try again.'; draw();
            });
            window.addEventListener('unityRewardEarned', function () {
              if (!popupAdPending) { alert('Rewarded ad completed.'); return; }
              popupAdPending = false; busy = false; count += 1;
              if (count >= 2) {
                localStorage.setItem('ieRewardUnlockUntil', String(Date.now() + 10 * 60 * 60 * 1000));
                localStorage.removeItem('ieRewardCount');
                count = 0;
                draw();
                checkAccess();
                return;
              }
              localStorage.setItem('ieRewardCount', String(count));
              message.textContent = 'First ad completed. Now watch the second ad.'; draw();
            });
            document.getElementById('unity-reward-btn').addEventListener('click', function () {
              if (window.UnityAdsBridge) window.UnityAdsBridge.showRewarded();
            });
            document.getElementById('unity-interstitial-btn').addEventListener('click', function () {
              if (window.UnityAdsBridge) window.UnityAdsBridge.showInterstitial();
            });
            // Give the first 3 minutes only once, and save the deadline immediately.
            // This makes closing/reopening the app unable to restart the free period.
            if (localStorage.getItem('ieInitialGraceUsed') !== '1') {
              var previousUnlock = parseInt(localStorage.getItem('ieRewardUnlockUntil') || '0', 10);
              localStorage.setItem('ieInitialGraceUsed', '1');
              if (Number.isFinite(previousUnlock) && previousUnlock > Date.now()) {
                localStorage.setItem('ieInitialGraceUntil', '0');
              } else {
                localStorage.setItem('ieInitialGraceUntil', String(Date.now() + 3 * 60 * 1000));
              }
            }

            var accessTimer = null;
            function scheduleAccessCheck(delay) {
              if (accessTimer !== null) window.clearTimeout(accessTimer);
              accessTimer = window.setTimeout(function () {
                accessTimer = null;
                checkAccess();
              }, Math.max(0, delay) + 50);
            }

            function checkAccess() {
              if (accessTimer !== null) {
                window.clearTimeout(accessTimer);
                accessTimer = null;
              }

              var now = Date.now();
              var savedUntil = parseInt(localStorage.getItem('ieRewardUnlockUntil') || '0', 10);
              if (!Number.isFinite(savedUntil) || savedUntil < 0) savedUntil = 0;

              // A valid 10-hour reward always takes priority over the first-run timer.
              if (savedUntil > now) {
                unlockUntil = savedUntil;
                popup.style.display = 'none';
                scheduleAccessCheck(savedUntil - now);
                return;
              }

              // Expired 10-hour access: clear it and require the ads again.
              if (savedUntil > 0) {
                localStorage.removeItem('ieRewardUnlockUntil');
                localStorage.removeItem('ieRewardCount');
                count = 0;
                unlockUntil = 0;
                draw();
              }

              var graceUntil = parseInt(localStorage.getItem('ieInitialGraceUntil') || '0', 10);
              if (!Number.isFinite(graceUntil)) graceUntil = 0;
              if (graceUntil > now) {
                popup.style.display = 'none';
                scheduleAccessCheck(graceUntil - now);
                return;
              }

              // Grace period is over (or was already used): keep the ad gate visible.
              popup.style.display = 'flex';
            }

            draw();
            checkAccess();
            window.addEventListener('focus', checkAccess);
            document.addEventListener('visibilitychange', function () {
              if (!document.hidden) checkAccess();
            });
          })();
          </script>
          <!-- INTEREXIVE_ADS_END -->
          '''

          # Remove older injected panels/blocks to prevent duplicate element IDs.
          html = re.sub(r'<!-- UNITY_ADS_CONTROL_PANEL -->.*?</script>\s*', '', html, flags=re.S)
          html = re.sub(r'<!-- INTEREXIVE_ADS_START -->.*?<!-- INTEREXIVE_ADS_END -->\s*', '', html, flags=re.S)
          if re.search(r'</body\s*>', html, re.I):
              html = re.sub(r'</body\s*>', addon + "\n</body>", html, count=1, flags=re.I)
          else:
              html += addon
          html_path.write_text(html)
          print("Unity Ads integration and 10-hour rewarded popup generated.")
          PY

          npx cap copy android
      - name: Build Signed APK
        shell: bash
        env:
          SIGNING_SECRET_KEY_ETC: ${{ secrets.SIGNING_SECRET_KEY_ETC }}
          KEYSTORE_PASSWORD: ${{ secrets.ALIAS____JJKS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}

        run: |
          set -euo pipefail

          : "${SIGNING_SECRET_KEY_ETC:?Missing signing key}"
          : "${KEYSTORE_PASSWORD:?Missing keystore password}"
          : "${KEY_ALIAS:?Missing key alias}"
          : "${KEY_PASSWORD:?Missing key password}"

          export KEYSTORE_FILE="$RUNNER_TEMP/release-key.jks"

          printf '%s' "$SIGNING_SECRET_KEY_ETC" | base64 --decode > "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE"

          keytool -list \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" > /dev/null

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          gradle_file = Path("android/app/build.gradle")
          content = gradle_file.read_text()

          android_block = re.search(r'(?m)^(\s*)android\s*\{', content)
          if not android_block:
              raise SystemExit("Android block not found")

          if not re.search(r'(?m)^\s*signingConfigs\s*\{', content):
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KEYSTORE_FILE"))
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          """
              content = (
                  content[:android_block.end()]
                  + signing_block
                  + content[android_block.end():]
              )

          build_types = re.search(r'(?m)^(\s*)buildTypes\s*\{', content)
          if not build_types:
              raise SystemExit("buildTypes block not found")

          release_block = re.search(
              r'(?m)^(\s*)release\s*\{',
              content[build_types.end():]
          )

          if not release_block:
              raise SystemExit("release block not found")

          if not re.search(
              r'\bsigningConfig\s+signingConfigs\.release\b',
              content
          ):
              position = build_types.end() + release_block.end()
              indent = release_block.group(1) + "    "
              content = (
                  content[:position]
                  + "\n"
                  + indent
                  + "signingConfig signingConfigs.release"
                  + content[position:]
              )

          version_code = 1000 + int(os.environ["BUILD_NUMBER"])

          content, count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              lambda match: match.group(1) + str(version_code),
              content,
              count=1
          )

          if count != 1:
              raise SystemExit("versionCode not found")

          gradle_file.write_text(content)
          print("Release signing and version code configured.")
          PY

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Interexive-Easy-APK
          path: android/app/build/outputs/apk/release/app-release.apk
